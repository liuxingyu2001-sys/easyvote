# Votifier 投票功能配置
votifier:
  # 是否启用 Votifier 投票功能
  enabled: true
  
  # Votifier 服务器监听地址
  host: 0.0.0.0
  
  # Votifier 服务器端口（默认 10022）
  port: 10022
  
  # RSA 密钥对（首次运行自动生成，请勿手动修改）
  public-key: ""
  private-key: ""
  
  # 最大线程数（处理投票请求）
  max-threads: 10

  # 玩家进入服务器后，等待多少秒再补发待发投票奖励（0 表示下一 tick）
  join-reward-delay-seconds: 5
  
  # 投票奖励配置
  # 支持的变量：
  #   %player% - 玩家名
  #   %player_name% - 玩家名（与 %player% 相同）
  #   %service% - 投票网站名称
  #   %address% - 投票来源 IP
  #   %uuid% - 玩家 UUID
  #
  # 只区分首次投票和普通投票，不区分投票网站
  rewards:
    # 首次投票奖励（玩家第一次投票时触发）
    first-vote:
      - "msg %player% &6&l感谢你的首次投票！"
      - "money give %player% 3000 -s"
      - "give %player% diamond 3"
    # 普通投票奖励（非首次投票时触发）
    vote:
      - "money give %player% 2000 -s"
      - "msg %player% &A感谢你为服务器投票 &6&l获得 2000 金币！"
    
  # 累计投票里程碑奖励
  # 玩家总投票数达到指定次数时触发一次性额外奖励
  # 每个里程碑每位玩家只触发一次
  cumulative:
    # 是否启用累计投票奖励
    enabled: true
    
    # 里程碑列表（按 count 从小到大排列）
    milestones:
      - count: 10
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c10 次&e！"
          - "give %player% diamond 10"
          - "money give %player% 5000"
      - count: 50
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c50 次&e！"
          - "give %player% netherite_ingot 5"
          - "money give %player% 10000"
      - count: 100
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c100 次&e！"
          - "give %player% netherite_block 2"
          - "lp user %player% parent addtemp vip 7d"
    
  # 是否在控制台显示详细投票信息
  verbose: false

debug: true
