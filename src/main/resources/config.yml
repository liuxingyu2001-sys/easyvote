# Votifier 投票功能配置
votifier:
  # 是否启用 Votifier 投票功能
  enabled: true
  
  # Votifier 服务器监听地址
  host: 0.0.0.0
  
  # Votifier 服务器端口（默认 10022）
  port: 10022
  
  # RSA 密钥对（首次运行自动生成，请勿手动修改）
  public-key: ""
  private-key: ""
  
  # 最大线程数（处理投票请求）
  max-threads: 10

  # 每位玩家每天最多计入的投票次数，所有网站合并；默认 1，0 表示不限
  # 按服务器本地时区的自然日及接收时间统计；超限不计数、不发奖励
  daily-vote-limit: 1

  # 玩家进入服务器后，等待多少秒再补发待发投票奖励（0 表示下一 tick）
  join-reward-delay-seconds: 5
  
  # 投票奖励配置
  # 支持的变量：
  #   %player% - 玩家名
  #   %player_name% - 玩家名（与 %player% 相同）
  #   %service% - 投票网站名称
  #   %address% - 投票来源 IP
  #   %uuid% - 玩家 UUID
  #
  # 只区分首次投票和普通投票，不区分投票网站
  rewards:
    # 首次投票奖励（玩家第一次投票时触发）
    first-vote:
      - "msg %player% &6&l感谢你的首次投票！"
      - "money give %player% 3000 -s"
      - "give %player% diamond 3"
    # 普通投票奖励（非首次投票时触发）
    vote:
      - "money give %player% 2000 -s"
      - "msg %player% &A感谢你为服务器投票 &6&l获得 2000 金币！"
    
  # 累计投票里程碑奖励
  # 达标只发可点击提醒，玩家用 /easyvote rewards 打开界面手动领取
  # 每个里程碑每位玩家只能领取一次；失败后再次点击续发
  cumulative:
    # 是否启用累计投票奖励
    enabled: true

    gui-title: "&6累计投票奖励"
    messages:
      # %count% 达标档位；%votes% 当前票数；%rewards% 该档 description
      # 整条消息可点击打开界面，悬停预览奖励图标（支持 CE）
      available: "&6[投票里程碑] &e已达到 %count% 次！可领取：%rewards% &a[点击打开]"
      success: "&a已领取累计投票 %count% 次奖励！"
      failed: "&c奖励未全部发放，请稍后再次点击领取，已发部分不会重复执行。"

    # 状态 lore 追加到 display.lore；可选 material/name/craftengine_model 覆盖图标
    states:
      locked:
        lore: ["&c尚未达标，继续投票吧"]
      available:
        lore: ["&a点击领取奖励"]
      received:
        lore: ["&7已领取，无法重复领取"]
    
    # 里程碑列表（按 count 从小到大排列）
    milestones:
      - count: 10
        description: "&b钻石 ×10 &7+ &e5000 金币"
        display:
          slot: 20
          material: DIAMOND
          # 与 LiuInvite 相同：CE 模型优先，缺失时回退 material
          # craftengine_model: "namespace:item_id"
          name: "&a累计投票 %count% 次奖励"
          lore:
            - "&7奖励：&b钻石 ×10"
            - "&7奖励：&e5000 金币"
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c10 次&e！"
          - "give %player% diamond 10"
          - "money give %player% 5000"
      - count: 50
        description: "&b下界合金锭 ×5 &7+ &e10000 金币"
        display:
          slot: 22
          material: NETHERITE_INGOT
          name: "&a累计投票 %count% 次奖励"
          lore:
            - "&7奖励：&b下界合金锭 ×5"
            - "&7奖励：&e10000 金币"
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c50 次&e！"
          - "give %player% netherite_ingot 5"
          - "money give %player% 10000"
      - count: 100
        description: "&b下界合金块 ×2 &7+ &eVIP 7 天"
        display:
          slot: 24
          material: NETHERITE_BLOCK
          name: "&a累计投票 %count% 次奖励"
          lore:
            - "&7奖励：&b下界合金块 ×2"
            - "&7奖励：&eVIP 7 天"
        commands:
          - "msg %player% &6&l恭喜！&e你已累计投票 &c100 次&e！"
          - "give %player% netherite_block 2"
          - "lp user %player% parent addtemp vip 7d"
    
  # 是否在控制台显示详细投票信息
  verbose: false

debug: true
