# 累计投票里程碑奖励（独立配置，/easyvote reload 重载）
# 达标只发可点击提醒，玩家用 /easyvote rewards 打开界面手动领取
# 每个里程碑每位玩家只能领取一次；失败后再次点击续发
# 奖励命令变量：%player% %player_name% %uuid% %service% %address%
# 是否启用累计投票奖励
enabled: true

gui-title: "&6累计投票奖励"
messages:
  # %count% 达标档位；%votes% 当前票数；%rewards% 该档 description
  # 整条消息可点击打开界面，悬停预览奖励图标（支持 CE）
  available: "&6[投票里程碑] &e已达到 %count% 次！可领取：%rewards% &a[点击打开]"
  success: "&a已领取累计投票 %count% 次奖励！"
  failed: "&c奖励未全部发放，请稍后再次点击领取，已发部分不会重复执行。"

# 状态 lore 追加到 display.lore；可选 material/name/craftengine_model 覆盖图标
states:
  locked:
    lore: ["&c尚未达标，继续投票吧"]
  available:
    lore: ["&a点击领取奖励"]
  received:
    lore: ["&7已领取，无法重复领取"]

# 里程碑列表（按 count 从小到大排列）
milestones:
  - count: 10
    description: "&b钻石 ×10 &7+ &e5000 金币"
    display:
      slot: 20
      material: DIAMOND
      # 与 LiuInvite 相同：CE 模型优先，缺失时回退 material
      # craftengine_model: "namespace:item_id"
      name: "&a累计投票 %count% 次奖励"
      lore:
        - "&7奖励：&b钻石 ×10"
        - "&7奖励：&e5000 金币"
    commands:
      - "msg %player% &6&l恭喜！&e你已累计投票 &c10 次&e！"
      - "give %player% diamond 10"
      - "money give %player% 5000"
  - count: 50
    description: "&b下界合金锭 ×5 &7+ &e10000 金币"
    display:
      slot: 22
      material: NETHERITE_INGOT
      name: "&a累计投票 %count% 次奖励"
      lore:
        - "&7奖励：&b下界合金锭 ×5"
        - "&7奖励：&e10000 金币"
    commands:
      - "msg %player% &6&l恭喜！&e你已累计投票 &c50 次&e！"
      - "give %player% netherite_ingot 5"
      - "money give %player% 10000"
  - count: 100
    description: "&b下界合金块 ×2 &7+ &eVIP 7 天"
    display:
      slot: 24
      material: NETHERITE_BLOCK
      name: "&a累计投票 %count% 次奖励"
      lore:
        - "&7奖励：&b下界合金块 ×2"
        - "&7奖励：&eVIP 7 天"
    commands:
      - "msg %player% &6&l恭喜！&e你已累计投票 &c100 次&e！"
      - "give %player% netherite_block 2"
      - "lp user %player% parent addtemp vip 7d"
