name: EasyVote
version: ${project.version}
main: com.easyvote.EasyVotePlugin
api-version: 1.21
folia-supported: true
author: liuxingyu
description: 轻量级 Votifier 投票监听插件，支持自定义投票奖励
softdepend: []
commands:
  easyvote:
    description: 管理 EasyVote 投票插件
    usage: /easyvote <reload|pubkey|votestats|testvote|clearvotes>
    permission: easyvote.admin
permissions:
  easyvote.admin:
    description: 允许管理 EasyVote 投票插件
    default: op
